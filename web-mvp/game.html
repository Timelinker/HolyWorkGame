function showSuccess(){s.lost=true;clearInterval(timer);const l=level();$("endingStamp").textContent="35岁 · 标准成功人士";$("endingTitle").innerHTML="有车有房，<br>然后呢？";$("endingText").innerHTML=`你升到了${l.now.title}，模拟年薪 ${money(l.now.annual)}，有房、有车、有两个孩子，也完成了一长串心愿。<br><br><strong>这一切，值得吗？</strong> 以下是“成功”留给你的每月债务。`;$("endingArt").hidden=false;$("endingDebts").innerHTML=debtMarkup();$("again").textContent="再过一次这份人生";$("gameover").hidden=false;document.documentElement.classList.add("modal-open");document.body.classList.add("modal-open")}
function showAgeFailure(){goToFailure("35岁 · 考核未通过",billTotal())}
function checkSuccess(){const l=level(),done=DESIRES.slice(0,s.fulfilled);if(s.lost)return true;if(ageNow()>=35){if(l.now.annual>=1000000&&done.some(x=>x.id==="home")&&done.some(x=>x.id==="child2"))showSuccess();else showAgeFailure();return true}return false}
function settle(){const total=billTotal();s.cash-=total;s.lastBill=total;if(s.cash<3000)showFailure(total);else s.message=`月底扣款 ${money(total)}。你保住了下个月的入场券。`}
function tick(){if(s.lost||currentChoice||panelIsOpen())return;const oldMonth=s.date.getMonth();s.date.setDate(s.date.getDate()+12);if(s.date.getMonth()!==oldMonth)settle();if(!s.lost)checkSuccess();draw()}
function restart(){clearInterval(timer);clearTimeout(eventTimer);currentChoice=null;sceneKey="";s=fresh();document.documentElement.classList.remove("modal-open");document.body.classList.remove("panel-open","modal-open");document.querySelectorAll(".panel.expanded").forEach(x=>x.classList.remove("expanded"));$("eventCard").classList.remove("show");$("choiceEvent").hidden=true;$("gameover").hidden=true;timer=setInterval(tick,1000);draw()}
$("work").addEventListener("pointerdown",work);document.addEventListener("keydown",e=>{if(e.code==="Escape"&&panelIsOpen()){const open=document.querySelector(".panel.expanded");if(open)togglePanel(open.id);return}if(e.code==="Space"&&!e.repeat&&!s.lost&&!currentChoice&&!panelIsOpen()){e.preventDefault();work(null)}});document.querySelectorAll(".panel-expand").forEach(x=>x.onclick=()=>togglePanel(x.dataset.panel));$("buy").onclick=buy;$("choiceA").onclick=()=>resolveChoice(0);$("choiceB").onclick=()=>resolveChoice(1);$("reset").onclick=restart;$("again").onclick=restart;timer=setInterval(tick,1000);draw();
</script>
</body></html>
