<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#25a9d2">
  <title>HolyWork — 永续增长计划</title>
  <style>
    :root {
      --cyan: #38c3e2;
      --cyan-deep: #1282aa;
      --ink: #145672;
      --green: #79dc56;
      --green-deep: #31ad3c;
      --cream: #fff8d8;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: white;
      background: #092b40;
      -webkit-tap-highlight-color: transparent;
    }

    .start-screen {
      position: relative;
      width: min(100vw, calc(100svh * 9 / 16));
      height: min(100svh, calc(100vw * 16 / 9));
      min-height: 520px;
      overflow: hidden;
      isolation: isolate;
      background: #62caec url("assets/start-screen-office-to-field-v1.png") center / cover no-repeat;
      box-shadow: 0 0 80px rgba(0, 0, 0, .5);
    }

    .start-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(5, 59, 92, .48) 0%, rgba(11, 92, 126, .08) 30%, transparent 53%),
        linear-gradient(0deg, rgba(5, 49, 71, .76) 0%, rgba(4, 53, 77, .15) 37%, transparent 57%);
    }

    .start-screen::after {
      content: "";
      position: absolute;
      inset: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
      z-index: 5;
      pointer-events: none;
      border: 3px solid rgba(255, 255, 255, .92);
      border-radius: 24px;
      box-shadow: inset 0 0 0 3px rgba(52, 187, 220, .75), 0 3px 0 rgba(11, 78, 105, .5);
    }

    .brand {
      position: absolute;
      top: max(26px, calc(env(safe-area-inset-top) + 16px));
      left: 24px;
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 900;
      font-size: clamp(15px, 4.2vw, 22px);
      letter-spacing: .09em;
      text-shadow: 0 2px 3px rgba(4, 67, 93, .65);
    }

    .brand-mark {
      width: 36px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 2px solid white;
      border-radius: 50%;
      color: white;
      background: linear-gradient(#a2ed6d, #3fbd44);
      box-shadow: 0 3px 0 #278835, 0 4px 9px rgba(0, 0, 0, .26);
    }

    .chapter {
      position: absolute;
      top: max(78px, calc(env(safe-area-inset-top) + 70px));
      left: 50%;
      width: max-content;
      max-width: 88%;
      transform: translateX(-50%);
      padding: 7px 18px;
      border: 2px solid rgba(255, 255, 255, .88);
      border-radius: 999px;
      font-size: clamp(11px, 3vw, 15px);
      font-weight: 800;
      letter-spacing: .08em;
      text-align: center;
      color: #185c76;
      background: rgba(226, 249, 255, .88);
      box-shadow: 0 3px 0 rgba(20, 105, 135, .38);
      backdrop-filter: blur(7px);
    }

    .title-block {
      position: absolute;
      top: 17%;
      left: 50%;
      width: 92%;
      transform: translateX(-50%);
      text-align: center;
      filter: drop-shadow(0 5px 2px rgba(4, 73, 101, .42));
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(46px, 13vw, 72px);
      line-height: .98;
      letter-spacing: .04em;
      font-weight: 1000;
      color: #fff;
      -webkit-text-stroke: 2px #187d9e;
      paint-order: stroke fill;
    }

    .title-en {
      margin-top: 8px;
      font-size: clamp(17px, 4.8vw, 25px);
      font-weight: 1000;
      letter-spacing: .26em;
      color: var(--cream);
      -webkit-text-stroke: 1px rgba(31, 112, 140, .75);
    }

    .entry {
      position: absolute;
      left: 50%;
      bottom: max(46px, calc(env(safe-area-inset-bottom) + 34px));
      width: min(84%, 420px);
      transform: translateX(-50%);
      text-align: center;
    }

    .tagline {
      margin: 0 0 16px;
      font-size: clamp(14px, 4vw, 20px);
      font-weight: 800;
      letter-spacing: .08em;
      text-shadow: 0 2px 5px #044a68, 0 0 14px rgba(2, 46, 66, .55);
    }

    .start-button {
      position: relative;
      display: block;
      width: 100%;
      min-height: 74px;
      padding: 15px 24px 13px;
      border: 4px solid white;
      border-radius: 22px;
      color: white;
      text-decoration: none;
      font-size: clamp(24px, 7vw, 36px);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: .12em;
      background: linear-gradient(180deg, #9aed62 0%, #5bd34d 50%, #2eb83e 51%, #48c844 100%);
      box-shadow: 0 6px 0 #188a38, 0 9px 0 rgba(255, 255, 255, .92), 0 14px 22px rgba(0, 51, 74, .38), inset 0 2px 0 rgba(255, 255, 255, .62);
      animation: breathe 2.2s ease-in-out infinite;
    }

    .start-button small {
      display: block;
      margin-top: 7px;
      font-size: clamp(9px, 2.7vw, 13px);
      font-weight: 900;
      letter-spacing: .28em;
      opacity: .9;
    }

    .start-button:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #188a38, 0 4px 0 white, 0 8px 14px rgba(0, 51, 74, .32);
      animation: none;
    }

    .footnote {
      margin-top: 22px;
      font-size: clamp(10px, 2.8vw, 14px);
      font-weight: 700;
      letter-spacing: .08em;
      opacity: .9;
      text-shadow: 0 2px 4px #064a65;
    }

    @keyframes breathe {
      0%, 100% { scale: 1; }
      50% { scale: 1.025; }
    }

    @media (prefers-reduced-motion: reduce) {
      .start-button { animation: none; }
    }

    @media (max-height: 610px) {
      .chapter { top: 62px; }
      .title-block { top: 15%; }
      .entry { bottom: 30px; }
      .footnote { margin-top: 13px; }
    }
  </style>
</head>
<body>
  <main class="start-screen" aria-label="HolyWork 游戏开始页面">
    <div class="brand"><span class="brand-mark">H</span><span>HOLYWORK</span></div>
    <div class="chapter">2019—2029 · 永续增长计划</div>

    <header class="title-block">
      <h1>神圣工作</h1>
      <div class="title-en">HOLYWORK</div>
    </header>

    <section class="entry">
      <p class="tagline">你有五分钟，证明这一切值得。</p>
      <a class="start-button" href="game.html">
        开始游戏
        <small>START WORKING</small>
      </a>
      <div class="footnote">职级会涨 · 账单会涨 · 窗外仍有风</div>
    </section>
  </main>
</body>
</html>
